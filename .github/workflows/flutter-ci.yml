name: flutter-ci

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    # [Skip CI] は信頼できる actor (owner/member/collaborator) の PR に限る。public repo では外部の PR 作者もタイトルを自由に変えられるため
    if: ${{ !(contains(github.event.pull_request.title, '[Skip CI]') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        flutter-version: '3.41.9'
    - run: flutter pub get
    - run: flutter analyze --no-pub --no-fatal-infos --fatal-warnings
    - run: dart format --set-exit-if-changed ./

  test:
    runs-on: ubuntu-latest
    # [Skip CI] は信頼できる actor (owner/member/collaborator) の PR に限る。public repo では外部の PR 作者もタイトルを自由に変えられるため
    if: ${{ !(contains(github.event.pull_request.title, '[Skip CI]') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        flutter-version: '3.41.9'
    - run: flutter pub get
    - run: flutter test
