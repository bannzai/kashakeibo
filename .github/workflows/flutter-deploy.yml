name: flutter-deploy

# 配布ワークフロー (iOS / Android)。main へのマージごとに自動起動し、手動起動 (workflow_dispatch) もできる。
# iOS: 手動署名で IPA をビルドし TestFlight (App Store Connect) へアップロードする。
# Android: release keystore で署名した AAB をビルドし Google Play の internal トラックへアップロードする
#   (署名の設計と secret の用意は android/README.md)。
# 構成は shoppinglist の flutter-deploy.yml を踏襲しつつ、以下を変更している:
# - public repo のため Team ID 等の識別子は直書きせず Secrets から注入する
# - 署名設定は project.pbxproj に持たせず、CI 実行時に Release.xcconfig へ追記する
#   (ローカルビルドは Automatic 署名のまま変わらない)
# - Android 配布用の secret が揃うまでは build-android を warning 付きで skip し、iOS の配布を止めない
#   (揃った後に欠けや不整合があれば fail させる。skip と fail の境界は check-android-secrets を参照)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'ビルド対象プラットフォーム (push 起動時は両方)'
        required: true
        type: choice
        default: both
        options:
          - ios
          - android
          - both
  push:
    branches:
      - main
    # アプリの成果物に影響する変更に限定する (ドキュメント・workers 等だけの変更で
    # macOS ビルドと TestFlight ビルドを積まない)
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'l10n.yaml'
      - '.github/workflows/flutter-deploy.yml'

# 連続マージ時は古いビルドをキャンセルして最新だけ配布する
concurrency:
  group: flutter-deploy
  cancel-in-progress: true

env:
  # ビルド番号 = github.run_number + offset。配布実績に合わせて必要なら増やす。
  BUILD_NUMBER_OFFSET: 0
  # ASC API で作成済みの App Store 配布 profile 名 (IOS_PROVISIONING_PROFILE_BASE64 の実体と一致させる)
  IOS_RUNNER_PROFILE_NAME: 'Kashakeibo Prod AppStore'
  # 共有 Extension (bundle ID com.bannzai.kashakeibo.ShareExtension) 用の App Store 配布 profile 名
  # (IOS_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 の実体と一致させる)。
  # Runner 側の profile にも App Groups (group.com.bannzai.kashakeibo) の capability が必要
  IOS_SHARE_EXTENSION_PROFILE_NAME: 'Kashakeibo.ShareExtension.AppStore.Prod'
jobs:
  build-ios:
    if: github.event_name == 'push' || inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version: '3.41.9'

      # git 管理外の Firebase クライアント設定を Secrets から復元する
      # (release ビルドは prod の plist を同梱するが、Xcode の build phase が
      # dev / prod を選択するため両方を復元する)
      - name: Restore Firebase configs
        env:
          GOOGLE_SERVICE_INFO_PLIST_PROD_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_PROD_BASE64 }}
          GOOGLE_SERVICE_INFO_PLIST_DEV_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_DEV_BASE64 }}
        run: |
          # plist は gitignore 対象でディレクトリ自体が checkout に存在しないため先に作る
          mkdir -p ios/Firebase/prod ios/Firebase/dev
          echo -n "$GOOGLE_SERVICE_INFO_PLIST_PROD_BASE64" | base64 --decode > ios/Firebase/prod/GoogleService-Info.plist
          echo -n "$GOOGLE_SERVICE_INFO_PLIST_DEV_BASE64" | base64 --decode > ios/Firebase/dev/GoogleService-Info.plist
          for f in ios/Firebase/prod/GoogleService-Info.plist ios/Firebase/dev/GoogleService-Info.plist; do
            case "$f" in
              *"/prod/"*) SECRET_NAME=GOOGLE_SERVICE_INFO_PLIST_PROD_BASE64 ;;
              *) SECRET_NAME=GOOGLE_SERVICE_INFO_PLIST_DEV_BASE64 ;;
            esac
            SIZE=$(wc -c < "$f")
            if [ "$SIZE" -lt 100 ]; then
              echo "::error::$f is suspiciously small ($SIZE bytes). Secret $SECRET_NAME が未登録か、base64 が壊れている可能性があります。"
              exit 1
            fi
            # REVERSED_CLIENT_ID が無い plist だと Google サインインが実行時に
            # PlatformException(missing support for the following URL schemes) で失敗するため、
            # ビルド前に落とす (issue #66。Firebase の iOS OAuth クライアント構成前に取得した古い secret を検出する)
            # CLIENT_ID は Info.plist の GIDClientID に、REVERSED_CLIENT_ID は URL スキームになる。
            # どちらが欠けても Runner のビルドフェーズは warning を出すだけで続行するため、
            # Google サインインが動かない IPA が無言で配布される。ここで両方を検査して落とす
            for KEY in CLIENT_ID REVERSED_CLIENT_ID; do
              VALUE=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$f" 2>/dev/null || true)
              if [ -z "$VALUE" ]; then
                echo "::error::$f の $KEY が空、またはキー自体がありません。firebase apps:sdkconfig IOS <App ID> --project <プロジェクトID> で取得し直した plist で Secret $SECRET_NAME を更新してください。"
                exit 1
              fi
            done
          done

      - run: flutter pub get

      # P12 証明書インポート (apple-actions で自動キーチェーン管理)
      - name: Import code signing certificate
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ secrets.IOS_P12_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      # Provisioning Profile インストール (Runner と共有 Extension の 2 つ)
      - name: Install Provisioning Profiles
        env:
          RUNNER_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          SHARE_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          [ -n "$RUNNER_PROFILE_BASE64" ] || { echo "::error::IOS_PROVISIONING_PROFILE_BASE64 is empty"; exit 1; }
          [ -n "$SHARE_EXTENSION_PROFILE_BASE64" ] || { echo "::error::IOS_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 is empty"; exit 1; }
          PROFILE_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILE_DIR"
          echo -n "$RUNNER_PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/runner.mobileprovision"
          echo -n "$SHARE_EXTENSION_PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/share_extension.mobileprovision"

      # バージョン解決 (app_version = pubspec.yaml、build number = run_number + offset)
      - name: Resolve app version
        id: version
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *\([^+]*\).*/\1/')
          APP_BUILD_NUMBER=$((${GITHUB_RUN_NUMBER} + ${BUILD_NUMBER_OFFSET}))
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_build_number=${APP_BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      # 手動署名設定を CI 実行時のみ Release.xcconfig (Runner) と ShareExtension-Release.xcconfig (共有 Extension) へ注入する。
      # リポジトリの pbxproj は Automatic 署名のままにし、識別子も残さない。
      - name: Inject manual signing settings
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$APPLE_TEAM_ID" ] || { echo "::error::APPLE_TEAM_ID is empty"; exit 1; }
          cat >> ios/Flutter/Release.xcconfig <<XCCONFIG
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM[sdk=iphoneos*] = ${APPLE_TEAM_ID}
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = iPhone Distribution
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*] = ${IOS_RUNNER_PROFILE_NAME}
          XCCONFIG
          cat >> ios/Flutter/ShareExtension-Release.xcconfig <<XCCONFIG
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM[sdk=iphoneos*] = ${APPLE_TEAM_ID}
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = iPhone Distribution
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*] = ${IOS_SHARE_EXTENSION_PROFILE_NAME}
          XCCONFIG

      # ExportOptions.plist を Secrets / env から生成
      - name: Generate ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bannzai.kashakeibo</key>
              <string>${IOS_RUNNER_PROFILE_NAME}</string>
              <key>com.bannzai.kashakeibo.ShareExtension</key>
              <string>${IOS_SHARE_EXTENSION_PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST

      # Prebuild (flutter build ipa の Dart defines 関連バグ回避のため一度 no-codesign でビルド)
      # REVENUECAT_PUBLIC_API_KEY_IOS_PROD は RevenueCat prod プロジェクトの App Store 用 public API key (appl_...)。
      # public リポジトリのためソースに置かず secret から注入する (lib/utils/purchase/purchase.dart)。
      # dev flavor の配布レーンを作る時は同じ形で REVENUECAT_PUBLIC_API_KEY_IOS_DEV を渡す。
      - name: Verify RevenueCat public API key
        env:
          REVENUECAT_PUBLIC_API_KEY_IOS_PROD: ${{ secrets.REVENUECAT_PUBLIC_API_KEY_IOS_PROD }}
        # 空のまま配布すると lib/utils/purchase/purchase.dart が SDK を初期化せず、
        # 料金プランの取得も購入もできない IPA が無言で TestFlight に上がる。
        # 配布レーンでは課金が動かないビルドを出さないため、ここで落とす
        run: |
          if [ -z "$REVENUECAT_PUBLIC_API_KEY_IOS_PROD" ]; then
            echo "::error::Secret REVENUECAT_PUBLIC_API_KEY_IOS_PROD が未登録または空です。RevenueCat prod プロジェクトの App Store 用 public API key (appl_...) を登録してください。"
            exit 1
          fi
          case "$REVENUECAT_PUBLIC_API_KEY_IOS_PROD" in
            appl_*) ;;
            *) echo "::error::Secret REVENUECAT_PUBLIC_API_KEY_IOS_PROD が App Store 用の public API key (appl_ で始まる) ではありません。" ; exit 1 ;;
          esac

      - name: Prebuild iOS
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=REVENUECAT_PUBLIC_API_KEY_IOS=${{ secrets.REVENUECAT_PUBLIC_API_KEY_IOS_PROD }} \
            --build-name=${{ steps.version.outputs.app_version }} \
            --build-number=${{ steps.version.outputs.app_build_number }}

      # IPA ビルド (手動署名 + ExportOptions.plist)
      - name: Build IPA
        run: |
          flutter build ipa --release \
            --dart-define=REVENUECAT_PUBLIC_API_KEY_IOS=${{ secrets.REVENUECAT_PUBLIC_API_KEY_IOS_PROD }} \
            --build-name=${{ steps.version.outputs.app_version }} \
            --build-number=${{ steps.version.outputs.app_build_number }} \
            --export-options-plist=ios/ExportOptions.plist

      # シンボル除去 (アップロードサイズ削減。失敗しても続行)
      - name: Remove symbols from IPA
        run: find build/ios/ipa -name "*.ipa" -exec zip -d {} "Symbols/*" \; || true

      # TestFlight アップロード (App Store Connect API Key 認証)
      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_API_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          xcrun altool --upload-app \
            -f build/ios/ipa/*.ipa \
            -t ios \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_KEY_ISSUER_ID"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/runner.mobileprovision || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/share_extension.mobileprovision || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8 || true

      # GitHub からの通知メールはフィルタで見落とすため、配布結果を Slack にも通知する
      # (bot token + chat.postMessage。slack-notification-setup の標準経路)
      - name: Slack に配布結果を通知
        if: always()
        # 通知は配布の成否に影響させない (TestFlight アップロード成功後に通知失敗でジョブを落とさない)
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_NOTIFY_CHANNEL: kashakeibo-notification
          JOB_STATUS: ${{ job.status }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          APP_BUILD_NUMBER: ${{ steps.version.outputs.app_build_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "SLACK_BOT_TOKEN が未設定のため Slack 通知をスキップしました" >&2
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            TEXT="✅ flutter-deploy 成功: v${APP_VERSION} (${APP_BUILD_NUMBER}) を TestFlight にアップロードしました: $RUN_URL"
          else
            TEXT="❌ flutter-deploy 失敗 (${JOB_STATUS}): $RUN_URL"
          fi
          # chat.postMessage はエラーでも HTTP 200 を返すため、レスポンスの ok で成否を判定する
          jq -n --arg channel "$SLACK_NOTIFY_CHANNEL" --arg text "$TEXT" \
                '{channel: $channel, text: $text}' \
            | curl -sf --connect-timeout 5 --max-time 30 \
                -X POST -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
                -H 'Content-Type: application/json; charset=utf-8' \
                --data @- https://slack.com/api/chat.postMessage \
            | jq -e '.ok' > /dev/null \
            || { echo "Slack 通知の送信に失敗しました" >&2; exit 1; }

  # Android 配布用の secret がすべて登録されているかを判定し、build-android の実行可否を出力する。
  # secrets コンテキストは job レベルの if から参照できないため、別 job で出力に変換する。
  # 未登録の間 (keystore・Play Console・RevenueCat の Play Store app の整備前) は warning を出して skip し、
  # main マージごとの iOS 配布を Android の未整備で赤くしない。登録後の欠け・不整合 (空の値、壊れた base64、
  # Google サインインに必要な OAuth client の欠落等) は build-android 側で fail させる。
  check-android-secrets:
    if: github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Android 配布用 secret の登録状況を確認
        id: check
        env:
          ANDROID_KEYSTORE_JKS_BASE64: ${{ secrets.ANDROID_KEYSTORE_JKS_BASE64 }}
          ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
          PLAY_SA_JSON_BASE64: ${{ secrets.PLAY_SA_JSON_BASE64 }}
          REVENUECAT_PUBLIC_API_KEY_ANDROID_PROD: ${{ secrets.REVENUECAT_PUBLIC_API_KEY_ANDROID_PROD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_JKS_BASE64 ANDROID_KEY_PROPERTIES_BASE64 PLAY_SA_JSON_BASE64 REVENUECAT_PUBLIC_API_KEY_ANDROID_PROD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::Android 配布用の secret が未登録のため build-android をスキップします:$missing (用意する手順は android/README.md)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    needs: check-android-secrets
    if: needs.check-android-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version: '3.41.9'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      # git 管理外の Firebase クライアント設定を Secrets から復元する。
      # release ビルドは app/ 直下 (kashakeibo-prod) だけを読む (android/app/build.gradle.kts の google-services plugin の説明)
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON_PROD_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}
        run: |
          [ -n "$GOOGLE_SERVICES_JSON_PROD_BASE64" ] || { echo "::error::GOOGLE_SERVICES_JSON_PROD_BASE64 is empty"; exit 1; }
          echo -n "$GOOGLE_SERVICES_JSON_PROD_BASE64" | base64 --decode > android/app/google-services.json
          SIZE=$(wc -c < android/app/google-services.json)
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::android/app/google-services.json is suspiciously small ($SIZE bytes). Secret GOOGLE_SERVICES_JSON_PROD_BASE64 が未登録か、base64 が壊れている可能性があります。"
            exit 1
          fi
          # Google サインイン (google_sign_in) は google-services.json の Web OAuth client (client_type 3) を
          # default_web_client_id として読む。release keystore の SHA-1 を Firebase に登録する前に取得した
          # google-services.json には oauth_client が無く、ビルドは通るが Google サインインだけが実行時に失敗する
          # AAB が無言で配布される (iOS の REVERSED_CLIENT_ID 検査と同じ理由。issue #66)。ここで落とす
          WEB_CLIENT_COUNT=$(jq '[.client[] | select(.client_info.android_client_info.package_name == "com.bannzai.kashakeibo") | .oauth_client[]? | select(.client_type == 3)] | length' android/app/google-services.json)
          if [ "$WEB_CLIENT_COUNT" -eq 0 ]; then
            echo "::error::android/app/google-services.json に com.bannzai.kashakeibo の Web OAuth client (client_type 3) がありません。release keystore の SHA-1 を kashakeibo-prod に登録し、google-services.json を取得し直して Secret GOOGLE_SERVICES_JSON_PROD_BASE64 を更新してください (scripts/android/setup-release-signing.sh)。"
            exit 1
          fi

      # release 署名情報を Secrets から復元する。配置先は android/app/build.gradle.kts が読む場所
      # (key.properties は android/ 直下、keystore は key.properties の storeFile が指す android/app/ 直下)
      - name: Restore signing
        env:
          ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
          ANDROID_KEYSTORE_JKS_BASE64: ${{ secrets.ANDROID_KEYSTORE_JKS_BASE64 }}
        run: |
          [ -n "$ANDROID_KEY_PROPERTIES_BASE64" ] || { echo "::error::ANDROID_KEY_PROPERTIES_BASE64 is empty"; exit 1; }
          [ -n "$ANDROID_KEYSTORE_JKS_BASE64" ] || { echo "::error::ANDROID_KEYSTORE_JKS_BASE64 is empty"; exit 1; }
          echo -n "$ANDROID_KEY_PROPERTIES_BASE64" | base64 --decode > android/key.properties
          echo -n "$ANDROID_KEYSTORE_JKS_BASE64" | base64 --decode > android/app/upload-keystore.jks

      # base64 デコードで生成した keystore と key.properties の整合性をビルド前に検証する。
      # 壊れた keystore やパスワード不一致は signReleaseBundle が分かりにくいエラーで失敗するため、
      # keytool でパスワードと alias を突き合わせて早期に検出する
      - name: Verify signing files
        run: |
          JKS_SIZE=$(wc -c < android/app/upload-keystore.jks)
          echo "upload-keystore.jks size: $JKS_SIZE bytes"
          if [ "$JKS_SIZE" -lt 1000 ]; then
            echo "::error::upload-keystore.jks is suspiciously small ($JKS_SIZE bytes). base64 decode may have produced a corrupted file."
            exit 1
          fi
          STORE_PASSWORD=$(sed -n 's/^storePassword=//p' android/key.properties)
          KEY_ALIAS=$(sed -n 's/^keyAlias=//p' android/key.properties)
          [ -n "$STORE_PASSWORD" ] || { echo "::error::key.properties の storePassword が空です"; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "::error::key.properties の keyAlias が空です"; exit 1; }
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::upload-keystore.jks を key.properties の storePassword / keyAlias で開けません。Secret ANDROID_KEYSTORE_JKS_BASE64 と ANDROID_KEY_PROPERTIES_BASE64 の組み合わせを確認してください。"; exit 1; }

      - run: flutter pub get

      # バージョン解決 (app_version = pubspec.yaml、build number = run_number + offset)。
      # versionCode は Play にアップロードするたびに増えている必要があり、iOS と同じ run_number 由来の値を使う
      - name: Resolve app version
        id: version
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *\([^+]*\).*/\1/')
          APP_BUILD_NUMBER=$((${GITHUB_RUN_NUMBER} + ${BUILD_NUMBER_OFFSET}))
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_build_number=${APP_BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      # REVENUECAT_PUBLIC_API_KEY_ANDROID_PROD は RevenueCat prod プロジェクトの Play Store 用 public API key (goog_...)。
      # iOS と同じく、空や別ストアのキーで課金が動かない AAB を配布しないためにビルド前に検査する
      - name: Verify RevenueCat public API key
        env:
          REVENUECAT_PUBLIC_API_KEY_ANDROID_PROD: ${{ secrets.REVENUECAT_PUBLIC_API_KEY_ANDROID_PROD }}
        run: |
          if [ -z "$REVENUECAT_PUBLIC_API_KEY_ANDROID_PROD" ]; then
            echo "::error::Secret REVENUECAT_PUBLIC_API_KEY_ANDROID_PROD が未登録または空です。RevenueCat prod プロジェクトの Play Store 用 public API key (goog_...) を登録してください。"
            exit 1
          fi
          case "$REVENUECAT_PUBLIC_API_KEY_ANDROID_PROD" in
            goog_*) ;;
            *) echo "::error::Secret REVENUECAT_PUBLIC_API_KEY_ANDROID_PROD が Play Store 用の public API key (goog_ で始まる) ではありません。" ; exit 1 ;;
          esac

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define=REVENUECAT_PUBLIC_API_KEY_ANDROID=${{ secrets.REVENUECAT_PUBLIC_API_KEY_ANDROID_PROD }} \
            --build-name=${{ steps.version.outputs.app_version }} \
            --build-number=${{ steps.version.outputs.app_build_number }}

      # Google Play サービスアカウント JSON を Secrets から復元する (Play Console で権限を付与済みのアカウント。android/README.md)
      - name: Restore Google Play service account
        env:
          PLAY_SA_JSON_BASE64: ${{ secrets.PLAY_SA_JSON_BASE64 }}
        run: |
          [ -n "$PLAY_SA_JSON_BASE64" ] || { echo "::error::PLAY_SA_JSON_BASE64 is empty"; exit 1; }
          echo -n "$PLAY_SA_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/play-sa.json"
          jq -e '.client_email' "$RUNNER_TEMP/play-sa.json" > /dev/null \
            || { echo "::error::PLAY_SA_JSON_BASE64 がサービスアカウント JSON (client_email を含む) ではありません。"; exit 1; }

      # internal トラックへアップロードする (production への昇格は Play Console で行う)。
      # Play Console 側でアプリの作成と初回の手動アップロードが済んでいないと packageName が見つからず失敗する (android/README.md)
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ runner.temp }}/play-sa.json
          packageName: com.bannzai.kashakeibo
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Cleanup
        if: always()
        run: |
          rm -f android/key.properties || true
          rm -f android/app/upload-keystore.jks || true
          rm -f "$RUNNER_TEMP/play-sa.json" || true

      # build-ios と同じ経路で配布結果を Slack に通知する
      - name: Slack に配布結果を通知
        if: always()
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_NOTIFY_CHANNEL: kashakeibo-notification
          JOB_STATUS: ${{ job.status }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          APP_BUILD_NUMBER: ${{ steps.version.outputs.app_build_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "SLACK_BOT_TOKEN が未設定のため Slack 通知をスキップしました" >&2
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            TEXT="✅ flutter-deploy (Android) 成功: v${APP_VERSION} (${APP_BUILD_NUMBER}) を Google Play の internal トラックにアップロードしました: $RUN_URL"
          else
            TEXT="❌ flutter-deploy (Android) 失敗 (${JOB_STATUS}): $RUN_URL"
          fi
          jq -n --arg channel "$SLACK_NOTIFY_CHANNEL" --arg text "$TEXT" \
                '{channel: $channel, text: $text}' \
            | curl -sf --connect-timeout 5 --max-time 30 \
                -X POST -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
                -H 'Content-Type: application/json; charset=utf-8' \
                --data @- https://slack.com/api/chat.postMessage \
            | jq -e '.ok' > /dev/null \
            || { echo "Slack 通知の送信に失敗しました" >&2; exit 1; }
