# GitHub Actions の iOS Simulator を simtunnel 経由で操作する caller workflow。
# 実体は bannzai/simtunnel の reusable workflow を commit SHA 固定で呼び出す。
name: simulator-session
run-name: "session=${{ inputs.session }} device=${{ inputs.device }}"

on:
  workflow_dispatch:
    inputs:
      session:
        description: "セッション名"
        required: true
        default: kashakeibo
      device:
        description: "Simulator のデバイス名"
        required: true
        default: iPhone 17
      duration_minutes:
        description: "セッション維持時間（分）"
        required: true
        default: "60"
      serve_sim:
        description: "ブラウザプレビューを起動する"
        required: false
        default: "false"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Firebase dev 設定を復元
        env:
          GOOGLE_SERVICE_INFO_PLIST_DEV_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_DEV_BASE64 }}
        run: |
          mkdir -p ios/Firebase/dev
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_DEV_BASE64" | base64 --decode > ios/Firebase/dev/GoogleService-Info.plist
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version: "3.41.9"
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: simulator-app
          path: build/ios/iphonesimulator

  session:
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: bannzai/simtunnel/.github/workflows/session.yml@a715305805c113d506612cfa1b15654963bf78c0
    with:
      session: ${{ inputs.session }}
      device: ${{ inputs.device }}
      duration_minutes: ${{ inputs.duration_minutes }}
      serve_sim: ${{ inputs.serve_sim }}
      app_artifact: simulator-app
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
